name: Build Android app

# Builds Jarvis.apk, the file you share to Android phones. Run it from the
# Actions tab ("Run workflow"), or push a tag like v2.0.1 to attach it to a
# release. Ubuntu runners have the Android SDK already, so this uses the free
# allowance at the normal rate.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        # The runner already ships the SDK; just agree to the licenses so
        # Gradle can use the installed build-tools and platform.
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Name it Jarvis.apk
        run: cp android/app/build/outputs/apk/release/app-release.apk Jarvis.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-android
          path: Jarvis.apk
          retention-days: 30

      - name: Attach to a release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Jarvis.apk
